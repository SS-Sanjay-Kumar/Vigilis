global:
  scrape_interval: 5s     
  evaluation_interval: 5s 

scrape_configs:
  - job_name: "vigilis-go-backend"
    metrics_path: "/v1/metrics"
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: "vigilis-python-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8000"]